kind = "web"
previewPath = "/"
title = "Kick Channel Site"
version = "1.0.0"
id = "artifacts/kick-channel"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23455

[services.development]
run = "pnpm --filter @workspace/kick-channel run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kick-channel", "run", "build" ]
publicDir = "artifacts/kick-channel/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23455"
BASE_PATH = "/"
